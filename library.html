<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine Bibliothek</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#0b0b0b; color:white; }
    .wrap { max-width:1200px; margin:0 auto; padding:32px 20px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:24px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:22px; }
    .card { background:#151515; border:1px solid #262626; border-radius:18px; padding:18px; }
    .card img { width:100%; height:320px; object-fit:cover; border-radius:12px; display:block; margin-bottom:14px; }
    .card h3 { margin:0 0 10px; }
    .card p { color:rgba(255,255,255,.8); }
    .btn, .top button {
      display:inline-block; padding:12px 16px; border:none; border-radius:10px;
      background:#f0b90b; color:#111; text-decoration:none; font-weight:bold; cursor:pointer;
      margin-top:8px;
    }
    .btn-open { background:#58d68d; }
    .btn-buy { width:100%; }
    .status { margin-top:10px; font-size:14px; }
    .status.pending { color:#ffd166; }
    .status.paid { color:#58d68d; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Meine Bibliothek</h1>
        <div>Vorschau lesen, dann kaufen, dann Freischaltung.</div>
      </div>
      <button onclick="logout()">Logout</button>
    </div>

    <div id="books" class="grid"></div>
  </div>

  <script src="app.js"></script>
  <script>
    loadBooksAndPurchases();
  </script>
</body>
</html>
