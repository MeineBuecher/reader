<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Das Universum als lebendiges Wesen</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0b0b0b;
  font-family: Arial, sans-serif;
}

.topbar {
  height: 60px;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid #222;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

.reader {
  height: calc(100% - 60px);
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #222;
}

.watermark {
  position: fixed;
  bottom: 10px;
  right: 15px;
  background: rgba(0,0,0,0.6);
  color: rgba(255,255,255,0.8);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">Das Universum als lebendiges Wesen</div>
  <div>Online-Leseansicht</div>
</div>

<div class="reader">
  <iframe src="das-universum-als-lebendiges-wesen.pdf#toolbar=0&navpanes=0"></iframe>
</div>

<div class="watermark">
  Nur zur persönlichen Nutzung
</div>

<script>
document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", function(e) {
  if (
    (e.ctrlKey && ["s","p","u","c"].includes(e.key.toLowerCase())) ||
    (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(e.key.toLowerCase())) ||
    e.key === "F12"
  ) {
    e.preventDefault();
  }
});
</script>

</body>
</html>
