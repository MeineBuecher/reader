<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#0b0b0b; color:white; display:grid; place-items:center; min-height:100vh; }
    .box { width:min(420px, 92vw); background:#151515; border:1px solid #262626; border-radius:18px; padding:24px; }
    input { width:100%; box-sizing:border-box; padding:12px; margin:8px 0; border-radius:10px; border:1px solid #333; background:#0f0f0f; color:#fff; }
    button { width:100%; padding:12px; border:none; border-radius:10px; background:#f0b90b; color:#111; font-weight:bold; margin-top:10px; cursor:pointer; }
    .secondary { background:#232323; color:#fff; border:1px solid #3a3a3a; }
  </style>
</head>

<body>
  <div class="box">
    <h1>Meine Bibliothek</h1>
    <p>Kostenlos anmelden und Vorschauen lesen.</p>

    <input id="email" type="email" placeholder="E-Mail">
    <input id="password" type="password" placeholder="Passwort">

    <button onclick="login()">Login</button>
    <button class="secondary" onclick="signUp()">Registrieren</button>
  </div>

  <script src="app.js"></script>

  <script>
    async function checkLogin() {
      const { data } = await client.auth.getUser();
      if (data.user) {
        window.location.href = "library.html";
      }
    }
    checkLogin();
  </script>

</body>
</html>
