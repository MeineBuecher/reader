<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine Bibliothek – Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .box {
      width: min(420px, 92vw);
      background: #151515;
      border: 1px solid #262626;
      border-radius: 18px;
      padding: 24px;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    p {
      margin: 0 0 18px;
      color: rgba(255,255,255,0.82);
      line-height: 1.5;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0f0f0f;
      color: #fff;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #f0b90b;
      color: #111;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    button.secondary {
      background: #232323;
      color: #fff;
      border: 1px solid #3a3a3a;
    }

    .note {
      margin-top: 18px;
      font-size: 14px;
      color: rgba(255,255,255,0.68);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Meine Bibliothek</h1>
    <p>Kostenlos anmelden, Vorschauen lesen und gekaufte Bücher freigeschaltet erhalten.</p>

    <input id="email" type="email" placeholder="E-Mail">
    <input id="password" type="password" placeholder="Passwort">

    <button onclick="login()">Login</button>
    <button class="secondary" onclick="signUp()">Registrieren</button>

    <div class="note">
      Nach der Anmeldung kannst du die Vorschauen lesen. Gekaufte Bücher werden für dein Konto freigeschaltet.
    </div>
  </div>

  <script src="app.js"></script>

  <script>
    async function checkLogin() {
      const { data } = await client.auth.getUser();
      if (data.user) {
        window.location.href = "library.html";
      }
    }

    checkLogin();
  </script>
</body>
</html>
</body>
</html>
