<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meine Bücherei</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 0;
      color: #222;
    }

    .page {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 36px;
      color: #1f2937;
    }

    .box {
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #374151;
      color: white;
      margin-right: 10px;
      font-size: 14px;
    }

    button:hover {
      background: #1f2937;
    }

    #status {
      margin-top: 12px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 10px;
      min-height: 20px;
      color: #374151;
    }

    #books {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }

    .book-card {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .book-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.08);
    }

    .book-cover {
      width: 120px;
      min-width: 120px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .book-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .book-title {
      font-size: 22px;
      font-weight: bold;
      margin: 0;
      color: #111827;
    }

    .book-description {
      font-size: 15px;
      line-height: 1.6;
      color: #4b5563;
      margin: 0;
      max-width: 650px;
    }

    .book-price {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      margin-top: 4px;
    }

    .book-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    @media (max-width: 700px) {
      .book-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .book-cover {
        width: 150px;
      }

      .book-info {
        align-items: center;
      }

      .book-buttons {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Meine Bücherei</h1>

    <div id="loginBox" class="box">
      <h2>Anmelden oder registrieren</h2>
      <input id="email" type="email" placeholder="E-Mail" />
      <input id="password" type="password" placeholder="Passwort" />
      <button id="registerBtn" type="button">Registrieren</button>
      <button id="loginBtn" type="button">Anmelden</button>
      <div id="status">Seite geladen...</div>
    </div>

    <div id="libraryBox" class="box" style="display:none;">
      <h2>Deine Bücher</h2>
      <button id="logoutBtn" type="button">Abmelden</button>
      <div id="books"></div>
    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
